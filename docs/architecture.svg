<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement flow</title><desc id="desc">Verified from commit 68c85a9. The browser calls Express routes. Four routers use ten library modules. Order placement validates stock and coupons, calculates totals, charges Khata when needed, deducts stock and writes the JSON database. Printable invoices use a separate calculation.</desc>
<defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#173331}.title{font-size:22px;font-weight:650}.body{font-size:18px}.label{font-size:19px;font-weight:600;fill:#506965}.flow{fill:none;stroke:#168565;stroke-width:4;marker-end:url(#arrow)}.shared{fill:none;stroke:#7b9693;stroke-width:2.5;marker-end:url(#grayarrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#168565"/></marker><marker id="grayarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#7b9693"/></marker></defs>
<rect width="1800" height="1380" fill="#f3f7f6"/><rect width="1800" height="108" fill="#102e2a"/><text x="40" y="52" style="font-size:34px;font-weight:700;fill:white">ShopLedger · architecture</text><text x="40" y="85" style="font-size:19px;fill:#a7d3c6">Checkpoint 2 · verified from source at 68c85a9 · green shows checkout flow</text>
<g><rect x="40" y="140" width="1720" height="85" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="60" y="172" class="title">public/ — browser UI</text><text x="60" y="201" class="body">index.html · css/style.css · js/app.js   |   POS checkout · order history · customer Khata · inventory and GST audit</text></g>
<path class="flow" d="M900 225V270"/><text x="920" y="252" class="label">HTTP / JSON; POST /api/orders to place an order</text>
<g><rect x="40" y="270" width="1720" height="95" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="60" y="302" class="title">server.js — Express application</text><text x="60" y="331" class="body">Serves public/ · mounts all four routers under /api · GET /orders/:id/invoice → store.read → orders.get → invoice.render</text></g>
<path class="shared" d="M900 365V392H240V420"/><path class="flow" d="M900 365V392H680V420"/><path class="shared" d="M900 392H1120V420"/><path class="shared" d="M900 392H1560V420"/>
<g><rect x="40" y="420" width="400" height="135" rx="12" fill="#ffffff" stroke="#cbd5db" stroke-width="2"/><text x="60" y="452" class="title">routes/products.js</text><text x="60" y="481" class="body">GET products / coupons</text><text x="60" y="505" class="body">Imports: store, inventory, tax,</text><text x="60" y="529" class="body">coupons</text></g>
<g><rect x="480" y="420" width="400" height="135" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="500" y="452" class="title">routes/orders.js</text><text x="500" y="481" class="body">GET / POST orders; cancel</text><text x="500" y="505" class="body">Imports: store, inventory, pricing,</text><text x="500" y="529" class="body">coupons, orders, ledger</text></g>
<g><rect x="920" y="420" width="400" height="135" rx="12" fill="#ffffff" stroke="#cbd5db" stroke-width="2"/><text x="940" y="452" class="title">routes/customers.js</text><text x="940" y="481" class="body">GET customers; POST settlement</text><text x="940" y="505" class="body">Imports: store, ledger</text></g>
<g><rect x="1360" y="420" width="400" height="135" rx="12" fill="#ffffff" stroke="#cbd5db" stroke-width="2"/><text x="1380" y="452" class="title">routes/reports.js</text><text x="1380" y="481" class="body">Dashboard; GST audit; preview; export</text><text x="1380" y="505" class="body">Imports: config, store, reports,</text><text x="1380" y="529" class="body">pricing, coupons</text></g>
<path class="flow" d="M680 555V590"/>
<rect x="40" y="590" width="1720" height="135" rx="12" fill="#dff1e9" stroke="#168565" stroke-width="2"/>
<text x="60" y="623" class="title">Order placement — routes/orders.js</text>
<text x="60" y="657" class="body">1  store.read → resolve product IDs / quantities → inventory.check → coupons.validate → pricing.computeTotals</text>
<text x="60" y="690" class="body">2  ledger.chargeOrderToKhata (credit only) → inventory.reserve → orders.add → store.appendAudit → store.write → HTTP 201</text>
<text x="40" y="761" class="label">Business modules in lib/ — each card lists its direct local dependencies</text>
<g><rect x="40" y="780" width="320" height="110" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="60" y="812" class="title">inventory.js</text><text x="60" y="841" class="body">Sellable stock, deduct / release</text><text x="60" y="865" class="body">Depends on config.js</text></g>
<g><rect x="390" y="780" width="320" height="110" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="410" y="812" class="title">pricing.js</text><text x="410" y="841" class="body">Checkout totals and line tax</text><text x="410" y="865" class="body">Depends on tax, coupons</text></g>
<g><rect x="740" y="780" width="320" height="110" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="760" y="812" class="title">orders.js</text><text x="760" y="841" class="body">Create, list, cancel orders</text><text x="760" y="865" class="body">Depends on dates, inventory, ledger</text></g>
<g><rect x="1090" y="780" width="320" height="110" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="1110" y="812" class="title">ledger.js</text><text x="1110" y="841" class="body">Credit balances and settlements</text><text x="1110" y="865" class="body">Depends on dates</text></g>
<g><rect x="1440" y="780" width="320" height="110" rx="12" fill="#ffffff" stroke="#cbd5db" stroke-width="2"/><text x="1460" y="812" class="title">reports.js</text><text x="1460" y="841" class="body">Dashboard and reconciliation</text><text x="1460" y="865" class="body">Depends on inventory, ledger, invoice</text></g>
<g><rect x="40" y="925" width="320" height="110" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="60" y="957" class="title">coupons.js</text><text x="60" y="986" class="body">Validation, limits, discounts</text><text x="60" y="1010" class="body">Depends on config.js</text></g>
<g><rect x="390" y="925" width="320" height="110" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="410" y="957" class="title">tax.js</text><text x="410" y="986" class="body">GST slabs; CGST / SGST split</text><text x="410" y="1010" class="body">Depends on config.js</text></g>
<g><rect x="740" y="925" width="320" height="110" rx="12" fill="#ffffff" stroke="#cbd5db" stroke-width="2"/><text x="760" y="957" class="title">dates.js</text><text x="760" y="986" class="body">Date keys and fiscal year</text><text x="760" y="1010" class="body">No local dependencies</text></g>
<g><rect x="1090" y="925" width="320" height="110" rx="12" fill="#ffffff" stroke="#cbd5db" stroke-width="2"/><text x="1110" y="957" class="title">invoice.js</text><text x="1110" y="986" class="body">Invoice figures and HTML</text><text x="1110" y="1010" class="body">Depends on config.js</text></g>
<g><rect x="1440" y="925" width="320" height="110" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="1460" y="957" class="title">store.js</text><text x="1460" y="986" class="body">JSON read / write; audit entries</text><text x="1460" y="1010" class="body">Uses built-in fs and path</text></g>
<path class="shared" d="M200 1035V1085H600V1125"/><text x="40" y="1072" class="label">Shared configuration</text>
<g><rect x="40" y="1125" width="1190" height="120" rx="12" fill="#ffffff" stroke="#cbd5db" stroke-width="2"/><text x="60" y="1157" class="title">config.js</text><text x="60" y="1186" class="body">Port, shop details, HSN GST slabs, inventory settings, coupons and admin key</text><text x="60" y="1210" class="body">Imported by server.js, routes/reports.js, inventory.js, tax.js, coupons.js and invoice.js</text></g>
<path class="flow" d="M1600 1035V1125"/><text x="1620" y="1090" class="label">read / write</text>
<g><rect x="1300" y="1125" width="460" height="120" rx="12" fill="#e5f5ed" stroke="#168565" stroke-width="2"/><text x="1320" y="1157" class="title">data/db.json</text><text x="1320" y="1186" class="body">Products · orders · customers</text><text x="1320" y="1210" class="body">Settlements · audit log · next IDs</text></g>
<text x="40" y="1300" class="label">Current behavior: printable invoices calculate separately from checkout; the GST audit compares both results.</text>
<text x="40" y="1334" class="body">Import lists describe source dependencies. This diagram does not claim every module runs for every request.</text>
</svg>